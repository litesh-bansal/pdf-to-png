spring.application.name=pdfToPng

# PDF -> PNG rendering (prebuilt pdfium libraries in src/main/resources/native, called via FFM).
# concurrency = how many independent renderers to create. Each one gets its own private copy of
# both native libraries at startup, and is one unit of render parallelism. Raising it costs
# ~8.5 MB of disk per copy in the temp directory.
pdf.render.concurrency=4
pdf.render.acquire-timeout=30s
pdf.render.default-dpi=150
pdf.render.max-dpi=600

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
